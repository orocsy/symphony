name: stripe-billing-evaluated
description: "Stripe billing scaffold using the official SDK plus LuxeBook-style webhook and entitlement boundary notes."
source: third-party-evaluated
provides:
  - Stripe client factory
  - webhook signature helper
  - billing projection type seed
depends_on:
  - env-validation-luxebook
default_decision: "Use Stripe's official SDK and hosted surfaces; reuse LuxeBook's idempotency and projection discipline without copying salon-specific plans."
official_sources:
  - https://docs.stripe.com/checkout
  - https://docs.stripe.com/webhooks
reject_when:
  - project has no money movement
  - project must use a non-Stripe payment provider
